name: Docker Image

on:
  # Called by release.yml or other workflows
  workflow_call:
    inputs:
      release:
        description: "Set true when called from release.yml to publish version/latest tags"
        required: false
        type: boolean
        default: false
      tag:
        description: "Image tag override (leave empty for auto-detect)"
        required: false
        type: string
        default: ""
  # On-demand builds
  workflow_dispatch:
    inputs:
      release:
        description: "Set true to force release-style tags (:version, :latest, :sha-xxx)"
        required: false
        type: boolean
        default: false
      tag:
        description: "Image tag override (leave empty for auto-detect)"
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve source git commit
        id: source_sha
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Source commit: ${SOURCE_SHA}"

      - name: Normalize registry owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Extracted version '${VERSION}' must match MAJOR.MINOR.PATCH[-prerelease] (Docker tags forbid '+')"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

      - name: Determine tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_RELEASE_BUILD: ${{ inputs.release && 'true' || 'false' }}
          INPUT_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/ironclaw
          WORKER_IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/ironclaw-worker
        run: |
          if [[ -n "${INPUT_TAG}" && ! "${INPUT_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Input tag '${INPUT_TAG}' does not match Docker tag grammar"
            exit 1
          fi

          SHA="sha-${SOURCE_SHA::7}"
          echo "sha_tag=${SHA}" >> "$GITHUB_OUTPUT"

          if [[ "${IS_RELEASE_BUILD}" == "true" ]]; then
            # Release: :version + :latest + :sha-xxx
            TAGS="${IMAGE_NAME}:${VERSION}"
            TAGS="${TAGS},${IMAGE_NAME}:latest"
            TAGS="${TAGS},${IMAGE_NAME}:${SHA}"
            WORKER_TAGS="${WORKER_IMAGE_NAME}:${VERSION}"
            WORKER_TAGS="${WORKER_TAGS},${WORKER_IMAGE_NAME}:latest"
            WORKER_TAGS="${WORKER_TAGS},${WORKER_IMAGE_NAME}:${SHA}"
          else
            # Manual dispatch: refresh the moving latest tag plus an immutable sha tag.
            TAGS="${IMAGE_NAME}:latest"
            TAGS="${TAGS},${IMAGE_NAME}:${SHA}"
            WORKER_TAGS="${WORKER_IMAGE_NAME}:latest"
            WORKER_TAGS="${WORKER_TAGS},${WORKER_IMAGE_NAME}:${SHA}"
          fi

          # Manual override adds an extra tag when a pinned alias is needed.
          if [[ -n "${INPUT_TAG}" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:${INPUT_TAG}"
            WORKER_TAGS="${WORKER_TAGS},${WORKER_IMAGE_NAME}:${INPUT_TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "worker_tags=${WORKER_TAGS}" >> "$GITHUB_OUTPUT"

          echo "target=runtime-staging" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push (ironclaw)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          target: ${{ steps.tags.outputs.target }}
          labels: |
            ironclaw.git.sha=${{ steps.source_sha.outputs.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (ironclaw-worker)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.tags.outputs.worker_tags }}
          labels: |
            ironclaw.git.sha=${{ steps.source_sha.outputs.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          WORKER_TAGS: ${{ steps.tags.outputs.worker_tags }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}
        run: |
          {
            echo "## Docker Images"
            echo ""
            echo "**ironclaw:**"
            echo '```'
            echo "${TAGS}" | tr ',' '\n'
            echo '```'
            echo ""
            echo "**ironclaw-worker:**"
            echo '```'
            echo "${WORKER_TAGS}" | tr ',' '\n'
            echo '```'
            echo ""
            echo "- version: \`${VERSION}\`"
            echo "- sha: \`${SOURCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
